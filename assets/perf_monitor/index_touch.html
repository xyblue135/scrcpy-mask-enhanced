<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>scrcpy-mask 映射性能监控</title>
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e3e5ea;
    --text: #1c1e23;
    --muted: #6b7280;
    --brand: #4b3fe3;
    --brand-soft: #f2f3ff;
    --series-1: #4b3fe3;
    --series-2: #efaa17;
    --danger: #e8463a;
    --ok: #1dc981;
    --radius: 10px;
    --mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { padding: 16px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }

  .topbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .status.off .dot { background: var(--danger); }
  .status.off { background: #fdeceb; }
  .status.waiting .dot { background: var(--series-2); }
  .path { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1 1 180px; min-width: 160px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 600; font-family: var(--mono); margin-top: 2px; }
  .stat .value small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .stat.muted { opacity: 0.55; }

  .chart-box { position: relative; height: 260px; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 9px; height: 9px; border-radius: 2px; }

  .info-banner {
    font-size: 12px; color: #155e75; background: #e0f2fe;
    border: 1px solid #bae6fd; border-radius: 8px; padding: 8px 12px; line-height: 1.6;
  }
  .info-banner b { color: #0c4a6e; }

  .action-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand-soft); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-family: var(--mono);
  }
  .action-chip b { font-weight: 600; }

  .empty { font-size: 12px; color: var(--muted); text-align: center; padding: 24px 8px; }

  /* 数据路径配置 */
  .path-config { display: flex; gap: 8px; }
  .path-config input {
    flex: 1; min-width: 0; padding: 6px 8px; font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px;
  }
  .path-config button {
    padding: 6px 14px; border: 1px solid var(--brand); background: var(--brand); color: #fff;
    border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .path-config button:hover { opacity: .9; }
  .path-config button:disabled { opacity: .5; cursor: default; }
  .path-status { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 14px; word-break: break-all; }
  .path-status.ok { color: var(--ok); }
  .path-status.err { color: var(--danger); }

  /* 停止监控按钮（页面级暂停） */
  .pause-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border: 1px solid var(--brand); background: #fff; color: var(--brand);
    border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500;
    white-space: nowrap; transition: background .15s, color .15s;
  }
  .pause-btn:hover { background: var(--brand-soft); }
  .pause-btn.paused { border-color: var(--danger); color: var(--danger); background: #fff5f4; }
  .pause-btn.paused:hover { background: #fdeceb; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card topbar">
    <h1>scrcpy-mask 映射性能监控</h1>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">连接中</span></span>
    <span class="path" id="path"></span>
    <button class="pause-btn" id="pauseBtn" type="button" title="仅暂停当前页面的显示，后端数据继续写入">
      <span id="pauseIcon">⏸</span><span id="pauseText">停止监控</span>
    </button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">事件 / 秒（最新）</div>
      <div class="value" id="eps">--</div>
    </div>
    <div class="stat">
      <div class="label">Move 占比</div>
      <div class="value" id="movePct">--</div>
    </div>
    <div class="stat">
      <div class="label">窗口内事件数</div>
      <div class="value" id="total">--</div>
    </div>
  </div>

  <div class="info-banner">
    <b>说明：</b>本页面对应 <b>touch_probe.jsonl</b>（每次注入手机的触摸事件一行）。
    折线图显示<b>事件延迟（since_last_ms）</b>——值越小说明注入越密集。
    若开随机抖动后延迟经常 &lt; 8ms（即每秒 100+ 条 Move），手机端就可能处理不过来而卡顿。
  </div>

  <div class="card">
    <h2>事件延迟 / 事件频率（时间窗口内）</h2>
    <div class="chart-box"><canvas id="rateChart"></canvas></div>
    <div class="legend">
      <span class="item"><span class="swatch" style="background:#efaa17"></span>事件延迟 ms（since_last_ms）</span>
      <span class="item"><span class="swatch" style="background:#4b3fe3"></span>事件/秒</span>
    </div>
  </div>

  <div class="card">
    <h2>Action 分布（时间窗口内）</h2>
    <div class="action-stats" id="actionStats"></div>
  </div>

  <div class="card">
    <h2>数据路径（touch_probe.jsonl 目录）</h2>
    <div class="path-config">
      <input type="text" id="dataDir" placeholder="粘贴目录，如 D:\…\target\debug\data" spellcheck="false" />
      <button id="applyDir">应用</button>
    </div>
    <div class="path-status" id="dirStatus"></div>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = {
  rateSeries: [],      // [{ts, v}] 事件/秒
  gapSeries: [],       // [{ts, v}] 事件延迟 ms
  actionCounts: {},    // {action: n}
  total: 0,
  lastTs: 0,
  windowSec: 120,
  paused: false,       // 页面级暂停：暂停后只丢数据，不渲染
  pending: [],         // 暂停期间累计的新行，恢复时一次性追平（避免恢复时涌入）
};

let rateChart;
function initChart() {
  if (typeof Chart === "undefined") return;
  rateChart = new Chart($("rateChart"), {
    type: "line",
    data: { datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false } },
      scales: {
        x: { type: "linear", ticks: { maxTicksLimit: 8 } },
        y: { beginAtZero: true, title: { display: true, text: "延迟 ms / 事件/秒" } },
      },
    },
  });
}

function renderStats(snap) {
  const evs = snap.events_per_sec || [];
  const latestEps = evs.length ? evs[evs.length - 1].v : 0;
  $("eps").textContent = latestEps || "--";

  const total = (snap.action_counts && Object.values(snap.action_counts).reduce((a, v) => a + v, 0)) || 0;
  const moves = (snap.action_counts && snap.action_counts.Move) || 0;
  $("movePct").textContent = total ? (moves / total * 100).toFixed(0) + "%" : "--";
  $("total").textContent = snap.total_events ?? "--";
}

function renderActionStats(counts) {
  const el = $("actionStats");
  el.innerHTML = "";
  const entries = Object.entries(counts || {});
  if (!entries.length) {
    el.innerHTML = '<span class="empty" style="padding:4px">暂无数据</span>';
    return;
  }
  for (const [action, count] of entries.sort((a, b) => b[1] - a[1])) {
    const chip = document.createElement("span");
    chip.className = "action-chip";
    chip.innerHTML = `<b>${action}</b> ${count}`;
    el.appendChild(chip);
  }
}

function renderCharts() {
  if (!rateChart) return;
  const rel = (ts) => +(ts - (state.lastTs - state.windowSec)).toFixed(1);
  rateChart.data.datasets = [
    {
      label: "事件延迟ms",
      data: state.gapSeries.map((p) => ({ x: rel(p.ts), y: p.v })),
      borderColor: "#efaa17", backgroundColor: "#efaa17", borderWidth: 1.5, pointRadius: 0, tension: 0.15,
      yAxisID: "y",
    },
    {
      label: "事件/秒",
      data: state.rateSeries.map((p) => ({ x: rel(p.ts), y: p.v })),
      borderColor: "#4b3fe3", backgroundColor: "#4b3fe3", borderWidth: 1.2, pointRadius: 0, tension: 0.15,
      yAxisID: "y",
    },
  ];
  rateChart.update();
}

function renderAll(snap) {
  state.rateSeries = snap.events_per_sec || [];
  state.gapSeries = snap.since_last || [];
  state.actionCounts = snap.action_counts || {};
  if (snap.total_events != null) state.total = snap.total_events;
  if (snap.now) state.lastTs = snap.now;
  renderStats(snap);
  renderActionStats(state.actionCounts);
  renderCharts();
}

function ingestRow(row) {
  // 页面级暂停：仅把行暂存，不更新前端状态；后端 SSE 不受影响
  if (state.paused) {
    state.pending.push(row);
    return;
  }
  // 新事件：追加到频率/间隔序列
  const ts = row.ts || 0;
  state.lastTs = ts;
  const cutoff = Date.now() / 1000 - state.windowSec;
  state.rateSeries.push({ ts: Math.floor(ts), v: 1 }); // 简化：近似
  state.gapSeries.push({ ts, v: row.since_last_ms ?? 0 });
  state.rateSeries = state.rateSeries.filter((p) => p.ts > cutoff);
  state.gapSeries = state.gapSeries.filter((p) => p.ts > cutoff);
  state.actionCounts[row.action || "?"] = (state.actionCounts[row.action || "?"] || 0) + 1;
  renderCharts();
  // 拉一次最新统计（事件/秒、Move 占比等）但**不**重绘整图，避免与上面的局部增量更新冲突
  fetch("/api/snapshot").then((r) => r.json()).then((s) => {
    renderStats(s);
    renderActionStats(s.action_counts || {});
  }).catch(() => {});
}

function connect() {
  const es = new EventSource("/events");
  es.addEventListener("snapshot", (e) => { try { renderAll(JSON.parse(e.data)); } catch (_) {} });
  es.addEventListener("message", (e) => {
    if (e.data === ": keepalive") return;
    try { ingestRow(JSON.parse(e.data)); } catch (_) {}
  });
  es.onopen = () => setStatus("live", "实时连接");
  es.onerror = () => {
    setStatus("off", "连接断开，重连中…");
    es.close();
    setTimeout(connect, 2000);
  };
}

function setStatus(kind, text) {
  const el = $("status");
  el.className = "status " + (kind === "live" ? "" : kind === "paused" ? "off" : kind);
  $("statusText").textContent = text;
}

// ---------- 停止监控（页面级暂停） ----------
function setupPauseBtn() {
  const btn = $("pauseBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    state.paused = !state.paused;
    if (state.paused) {
      btn.classList.add("paused");
      $("pauseIcon").textContent = "▶";
      $("pauseText").textContent = "恢复监控";
      setStatus("paused", "已暂停（后端继续写入）");
    } else {
      btn.classList.remove("paused");
      $("pauseIcon").textContent = "⏸";
      $("pauseText").textContent = "停止监控";
      setStatus("live", "实时连接");
      // 恢复时把暂停期间累计的事件一次性追平，避免"恢复瞬间涌入"
      // 用最新一份 /api/snapshot 取代本地状态，保证窗口边界一致。
      const pending = state.pending;
      state.pending = [];
      if (pending.length) {
        fetch("/api/snapshot").then((r) => r.json()).then((snap) => {
          renderAll(snap);
        }).catch(() => {});
      }
    }
  });
}

// ---------- 数据路径配置（网页内自定义，替代写死路径） ----------
function setupPathConfig() {
  const LS_KEY = "touch_monitor_dir";
  const dirInput = $("dataDir");
  const applyBtn = $("applyDir");
  const statusEl = $("dirStatus");
  if (!dirInput) return;

  // 先用本地保存的值预填，避免空白等待
  const saved = localStorage.getItem(LS_KEY);
  if (saved) dirInput.value = saved;

  // 再向服务端拉取当前生效路径
  fetch("/api/config").then((r) => r.json()).then((c) => {
    if (c && c.dir) {
      dirInput.value = c.dir;
      localStorage.setItem(LS_KEY, c.dir);
    }
  }).catch(() => {});

  applyBtn.addEventListener("click", async () => {
    const dir = dirInput.value.trim();
    if (!dir) {
      statusEl.className = "path-status err";
      statusEl.textContent = "请先填写目录路径";
      return;
    }
    applyBtn.disabled = true;
    statusEl.className = "path-status";
    statusEl.textContent = "应用中…";
    try {
      const resp = await fetch("/api/set-path", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dir }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        localStorage.setItem(LS_KEY, dir);
        statusEl.className = "path-status ok";
        statusEl.textContent = data.warning ? "已应用（" + data.warning + "）" : "已应用 ✓";
        $("path").textContent = data.file || dir;
      } else {
        statusEl.className = "path-status err";
        statusEl.textContent = "失败：" + (data.error || resp.status);
      }
    } catch (e) {
      statusEl.className = "path-status err";
      statusEl.textContent = "请求失败：" + e.message;
    } finally {
      applyBtn.disabled = false;
      setTimeout(() => { statusEl.textContent = ""; statusEl.className = "path-status"; }, 4000);
    }
  });
}

setInterval(() => {
  // 暂停态下不要用"等待数据"覆盖状态
  if (state.paused) return;
  if (Date.now() / 1000 - state.lastTs > 5) {
    $("status").className = "status waiting";
    $("statusText").textContent = "等待主程序写入数据…";
  } else {
    $("status").className = "status";
    $("statusText").textContent = "实时连接";
  }
}, 2000);

fetch("/health").then((r) => r.json()).then((h) => { $("path").textContent = h.file || ""; }).catch(() => {});
fetch("/api/snapshot").then((r) => r.json()).then(renderAll).catch(() => {});
setupPathConfig();
setupPauseBtn();
initChart();
connect();
</script>
</body>
</html>
